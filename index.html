<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Інтерактивна карта саду | с. Потелич</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
      background: #1a1a1a;
    }

    /* Панель легенди */
    .legend-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(4px);
      padding: 14px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
      font-size: 13px;
      min-width: 220px;
    }

    .legend-title {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 14px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
      color: #222;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
    }

    /* Маркери рослин */
    .tree-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease-out;
    }

    .tree-icon:hover {
      transform: scale(1.4);
      z-index: 1000 !important;
    }

    /* Прапорці відправних точок */
    .origin-flag {
      background: #ffeb3b;
      color: #000;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 8px;
      border: 2px solid #d32f2f;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    .popup-box {
      font-size: 13px;
      min-width: 200px;
      line-height: 1.45;
    }

    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #1b5e20;
      margin-bottom: 6px;
    }

    .popup-field {
      margin-bottom: 3px;
    }

    .popup-field span {
      color: #666;
    }

    .popup-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="legend-panel">
    <div class="legend-title">Стан насаджень</div>
    <div class="status-row"><span class="status-dot" style="background:#2e7d32;"></span> Прижилося</div>
    <div class="status-row"><span class="status-dot" style="background:#1976d2;"></span> Посаджено</div>
    <div class="status-row"><span class="status-dot" style="background:#f57c00;"></span> Сумнівно</div>
    <div class="status-row"><span class="status-dot" style="background:#d32f2f;"></span> Засохло</div>
    <div id="loadStatus"
      style="margin-top: 8px; font-size: 11px; color: #555; border-top: 1px dashed #ccc; padding-top: 6px;">
      Завантаження...
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // 1. Карта
    const map = L.map('map', {
      center: [50.1761, 23.5526],
      zoom: 18,
      maxZoom: 22
    });

    const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 22,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: 'Google Satellite'
    }).addTo(map);

    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });

    // 2. Межі ділянки
    const rawCoords = [
      [23.552623007, 50.175859531],
      [23.552169358, 50.176035001],
      [23.551742658, 50.175922815],
      [23.550862309, 50.176250741],
      [23.551428248, 50.176687972],
      [23.554073786, 50.175770358],
      [23.553974972, 50.175655295],
      [23.553579713, 50.175799124],
      [23.553121572, 50.175940075],
      [23.552991316, 50.175753099],
      [23.552623007, 50.175859531]
    ];

    L.polygon(rawCoords.map(p => [p[1], p[0]]), {
      color: "#ffffff",
      weight: 2,
      dashArray: "4, 4",
      fillColor: "#4caf50",
      fillOpacity: 0.05
    }).addTo(map);

    // 3. Відправні точки
    const ORIGINS = {
      house: { lat: 50.175792, lon: 23.554144 },
      main: { lat: 50.175978, lon: 23.553016 }
    };

    L.marker([ORIGINS.main.lat, ORIGINS.main.lon], {
      icon: L.divIcon({
        className: '',
        html: '<div class="origin-flag">🚩 СТАРТ MAIN (0,0)</div>',
        iconSize: [120, 24],
        iconAnchor: [60, 12]
      })
    }).addTo(map).bindPopup("<b>Точка Main:</b> 50.175978, 23.553016");

    L.marker([ORIGINS.house.lat, ORIGINS.house.lon], {
      icon: L.divIcon({
        className: '',
        html: '<div class="origin-flag">🏠 СТАРТ ХАТА (0,0)</div>',
        iconSize: [120, 24],
        iconAnchor: [60, 12]
      })
    }).addTo(map).bindPopup("<b>Точка Хата:</b> 50.175792, 23.554144");

    const M_TO_LAT = 0.00000899;
    const M_TO_LON = 0.00001402;

    const rowsConfig = {};

    function normalizeRowId(rowStr) {
      const s = String(rowStr).trim().toLowerCase();
      if (s === 'h-r1' || s === 'm-r1' || s === '1') return '1';
      if (s === 'h-r2' || s === 'm-r2' || s === '2') return '2';
      if (s === 'm-r3' || s === '3') return '3';
      if (s === 'm-r4' || s === '4') return '4';
      if (s === 'm-r5' || s === '5') return '5';
      if (s === 'm-r6' || s === '6') return '6';
      if (s === 'm-r7' || s === '7') return '7';
      if (s === 'h-g' || s === 'перед городом') return 'перед городом';
      if (s === 'h-h' || s === 'біля хати') return 'біля хати';
      return s;
    }

    // 4. Розрахунок позиції рослини з урахуванням компасного азимута bearing_deg
    function calculateTreeCoords(plot, row, dist) {
      const isHouse = (plot.toLowerCase() === 'house');
      const base = isHouse ? ORIGINS.house : ORIGINS.main;

      const cleanRow = normalizeRowId(row);
      const key = `${plot.toLowerCase()}_${cleanRow}`;

      // Беремо параметри суворо з rows.csv
      const conf = rowsConfig[key] || { offset_m: 0.0, bearing_deg: 298.0 };
      const rowOffset = conf.offset_m;
      const bearing = conf.bearing_deg;

      // 1. Вектор вздовж ряду (дистанція в метрах)
      const radBearing = (bearing * Math.PI) / 180;
      const dNorth_dist = dist * Math.cos(radBearing);
      const dEast_dist = dist * Math.sin(radBearing);

      // 2. Вектор міжряддя (розвернуто в протилежний бік: +90° замість -90°)
      const radPerp = ((bearing + 90) * Math.PI) / 180;
      const dNorth_offset = rowOffset * Math.cos(radPerp);
      const dEast_offset = rowOffset * Math.sin(radPerp);

      // Підсумкове зміщення
      const dNorth = dNorth_dist + dNorth_offset;
      const dEast = dEast_dist + dEast_offset;

      const lat = base.lat + (dNorth * M_TO_LAT);
      const lon = base.lon + (dEast * M_TO_LON);

      return [lat, lon];
    }
    // 5. Маркери рослин
    const mainGroup = L.layerGroup().addTo(map);
    const houseGroup = L.layerGroup().addTo(map);

    const statusConfig = {
      'прижилося': { color: '#2e7d32', label: 'Прижилося' },
      'посаджено': { color: '#1976d2', label: 'Посаджено' },
      'сумнівно': { color: '#f57c00', label: 'Сумнівно' },
      'засохло': { color: '#d32f2f', label: 'Засохло' }
    };

    function addTreeMarker(item) {
      const dist = parseFloat(item.distance_m);
      if (isNaN(dist)) return;

      const coords = calculateTreeCoords(item.plot, item.row, dist);
      const cfg = statusConfig[item.status] || { color: '#757575', label: item.status || 'Невідомо' };

      const isBush = ['Малина', 'Смородина', 'Аґрус', 'Жимолость'].some(c => (item.crop || '').includes(c));
      const iconSymbol = isBush ? '🫐' : '🌳';
      const markerSize = isBush ? 18 : 22;

      const treeIcon = L.divIcon({
        className: 'tree-marker-div',
        html: `<div class="tree-icon" style="background:${cfg.color}; width:${markerSize}px; height:${markerSize}px;">${iconSymbol}</div>`,
        iconSize: [markerSize, markerSize],
        iconAnchor: [markerSize / 2, markerSize / 2]
      });

      const marker = L.marker(coords, { icon: treeIcon });

      const popupContent = `
        <div class="popup-box">
          <div class="popup-title">${item.crop || ''} ${item.variety ? `"${item.variety}"` : ''}</div>
          <div class="popup-field"><span>ID:</span> <b>${item.tree_id || ''}</b></div>
          <div class="popup-field"><span>Ділянка:</span> ${(item.plot || '').toUpperCase()}, Ряд ${item.row || ''}</div>
          <div class="popup-field"><span>Позиція:</span> <b>${item.distance_m || 0} м</b></div>
          ${item.rootstock ? `<div class="popup-field"><span>Підщепа:</span> ${item.rootstock}</div>` : ''}
          ${item.planted_year ? `<div class="popup-field"><span>Рік:</span> ${item.planted_year}</div>` : ''}
          ${item.notes ? `<div class="popup-field"><span>Нотатка:</span> ${item.notes}</div>` : ''}
          <div><span class="popup-badge" style="background:${cfg.color}22; color:${cfg.color};">${cfg.label}</span></div>
        </div>
      `;

      marker.bindPopup(popupContent);
      marker.bindTooltip(`${item.crop || ''} (${item.distance_m}м)`, { direction: 'top', offset: [0, -10] });

      if (item.plot.toLowerCase() === 'house') {
        houseGroup.addLayer(marker);
      } else {
        mainGroup.addLayer(marker);
      }
    }

    function parseCSV(url) {
      return new Promise((resolve, reject) => {
        Papa.parse(url + '?t=' + Date.now(), {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: res => resolve(res.data),
          error: err => reject(err)
        });
      });
    }

    // 6. Послідовна ініціалізація
    async function initGarden() {
      const statusEl = document.getElementById('loadStatus');
      try {
        // Крок 1: Обов'язкове завантаження rows.csv
        const rowsData = await parseCSV('./Data/rows.csv');
        rowsData.forEach(r => {
          if (r.row_id && r.plot) {
            const cleanRow = normalizeRowId(r.row_id);
            const key = `${r.plot.trim().toLowerCase()}_${cleanRow}`;
            rowsConfig[key] = {
              offset_m: parseFloat(r.offset_m) || 0.0,
              bearing_deg: parseFloat(r.bearing_deg) || 298.0
            };
          }
        });
        console.log('Завантажено конфігурацію rows.csv:', rowsConfig);

        // Крок 2: Завантаження дерев
        const treesData = await parseCSV('./Data/trees.csv');
        const validRows = treesData.filter(r => r.tree_id && r.crop);
        validRows.forEach(addTreeMarker);

        statusEl.innerHTML = `Відображено рослин: <b>${validRows.length}</b>`;

      } catch (err) {
        console.error(err);
        statusEl.innerHTML = `<span style="color:#d32f2f;">Помилка завантаження файлів з Data/</span>`;
      }
    }

    initGarden();

    // 7. Контрол вибору шарів
    L.control.layers({ "Google Супутник": googleSat, "OpenStreetMap": osm }, {
      "Основний сад (Main)": mainGroup,
      "Біля хати (House)": houseGroup
    }, { position: 'topleft', collapsed: false }).addTo(map);
  </script>
</body>

</html>

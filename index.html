<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Інтерактивна карта саду | с. Потелич</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
      background: #1a1a1a;
    }

    /* Панель легенди */
    .legend-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(4px);
      padding: 14px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
      font-size: 13px;
      min-width: 220px;
    }

    .legend-title {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 14px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
      color: #222;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
    }

    /* Маркери рослин */
    .tree-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease-out;
    }

    .tree-icon:hover {
      transform: scale(1.4);
      z-index: 1000 !important;
    }

    /* Спливаючий блок інформації (Popup) */
    .popup-box {
      font-size: 13px;
      min-width: 200px;
      line-height: 1.45;
    }

    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #1b5e20;
      margin-bottom: 6px;
    }

    .popup-field {
      margin-bottom: 3px;
    }

    .popup-field span {
      color: #666;
    }

    .popup-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="legend-panel">
    <div class="legend-title">Стан насаджень</div>
    <div class="status-row"><span class="status-dot" style="background:#2e7d32;"></span> Прижилося</div>
    <div class="status-row"><span class="status-dot" style="background:#1976d2;"></span> Посаджено</div>
    <div class="status-row"><span class="status-dot" style="background:#f57c00;"></span> Сумнівно</div>
    <div class="status-row"><span class="status-dot" style="background:#d32f2f;"></span> Засохло</div>
    <div id="loadStatus"
      style="margin-top: 8px; font-size: 11px; color: #555; border-top: 1px dashed #ccc; padding-top: 6px;">
      Завантаження насаджень...
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // 1. Ініціалізація карти
    const map = L.map('map', {
      center: [50.1761, 23.5526],
      zoom: 18,
      maxZoom: 22
    });

    // Підкладка Google Супутник
    const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 22,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: 'Google Satellite'
    }).addTo(map);

    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });

    // 2. Межі кадастрової ділянки
    const rawCoords = [
      [23.552623007, 50.175859531],
      [23.552169358, 50.176035001],
      [23.551742658, 50.175922815],
      [23.550862309, 50.176250741],
      [23.551428248, 50.176687972],
      [23.554073786, 50.175770358],
      [23.553974972, 50.175655295],
      [23.553579713, 50.175799124],
      [23.553121572, 50.175940075],
      [23.552991316, 50.175753099],
      [23.552623007, 50.175859531]
    ];

    const parcelPolygon = L.polygon(rawCoords.map(p => [p[1], p[0]]), {
      color: "#ffffff",
      weight: 2,
      dashArray: "4, 4",
      fillColor: "#4caf50",
      fillOpacity: 0.05
    }).addTo(map);

    // 3. Зафіксовані опорні точки
    const ORIGINS = {
      house: { lat: 50.175792, lon: 23.554144 }, // Південний схід зони біля хати
      main: { lat: 50.176099, lon: 23.553156 }  // Південний схід ділянки Main
    };

    const M_TO_LAT = 0.00000899;
    const M_TO_LON = 0.00001402;

    // Кут орієнтації рядів на північний схід уздовж осі ділянки
    const ROW_ANGLE_DEG = 26.0;
    const ROW_SPACING_M = 3.5;  // крок між рядами в метрах

    const rad = (ROW_ANGLE_DEG * Math.PI) / 180;
    const COS_A = Math.cos(rad);
    const SIN_A = Math.sin(rad);

    // 4. Розрахунок позиції рослини
    function calculateTreeCoords(plot, row, dist) {
      const isHouse = (plot === 'house');
      const base = isHouse ? ORIGINS.house : ORIGINS.main;
      let rowOffset = 0;

      if (isHouse) {
        if (row === '1' || row === 'H-R1') rowOffset = 0.0;
        else if (row === '2' || row === 'H-R2') rowOffset = 3.5;
        else if (row === 'перед городом' || row === 'H-G') rowOffset = 7.0;
        else if (row === 'біля хати' || row === 'H-H') rowOffset = 11.5;
        else {
          const match = String(row).match(/\d+/);
          rowOffset = match ? (parseInt(match[0]) - 1) * ROW_SPACING_M : 0;
        }
      } else {
        // Ділянка Main: ряди 1..7
        let rNum = 1;
        if (typeof row === 'string') {
          const match = row.match(/\d+/);
          rNum = match ? parseInt(match[0]) : 1;
        } else {
          rNum = parseInt(row) || 1;
        }
        rowOffset = (rNum - 1) * ROW_SPACING_M;
      }

      // Напрямок: dist відкладається на північний схід (+lat, +lon),
      // а rowOffset зміщує ряди всередину ділянки
      const dNorth = (dist * SIN_A) - (rowOffset * COS_A);
      const dEast = (dist * COS_A) + (rowOffset * SIN_A);

      const lat = base.lat + (dNorth * M_TO_LAT);
      const lon = base.lon + (dEast * M_TO_LON);

      return [lat, lon];
    }

    // 5. Рендеринг маркерів
    const mainGroup = L.layerGroup().addTo(map);
    const houseGroup = L.layerGroup().addTo(map);

    const statusConfig = {
      'прижилося': { color: '#2e7d32', label: 'Прижилося' },
      'посаджено': { color: '#1976d2', label: 'Посаджено' },
      'сумнівно': { color: '#f57c00', label: 'Сумнівно' },
      'засохло': { color: '#d32f2f', label: 'Засохло' }
    };

    function addTreeMarker(item) {
      const dist = parseFloat(item.distance_m);
      if (isNaN(dist)) return;

      const coords = calculateTreeCoords(item.plot, item.row, dist);
      const cfg = statusConfig[item.status] || { color: '#757575', label: item.status || 'Невідомо' };

      const isBush = ['Малина', 'Смородина', 'Аґрус', 'Жимолость'].some(c => (item.crop || '').includes(c));
      const iconSymbol = isBush ? '🫐' : '🌳';
      const markerSize = isBush ? 18 : 22;

      const treeIcon = L.divIcon({
        className: 'tree-marker-div',
        html: `<div class="tree-icon" style="background:${cfg.color}; width:${markerSize}px; height:${markerSize}px;">${iconSymbol}</div>`,
        iconSize: [markerSize, markerSize],
        iconAnchor: [markerSize / 2, markerSize / 2]
      });

      const marker = L.marker(coords, { icon: treeIcon });

      const popupContent = `
        <div class="popup-box">
          <div class="popup-title">${item.crop || ''} ${item.variety ? `"${item.variety}"` : ''}</div>
          <div class="popup-field"><span>ID:</span> <b>${item.tree_id || ''}</b></div>
          <div class="popup-field"><span>Ділянка:</span> ${(item.plot || '').toUpperCase()}, Ряд ${item.row || ''}</div>
          <div class="popup-field"><span>Позиція в ряду:</span> <b>${item.distance_m || 0} м</b></div>
          ${item.rootstock ? `<div class="popup-field"><span>Підщепа:</span> ${item.rootstock}</div>` : ''}
          ${item.planted_year ? `<div class="popup-field"><span>Рік висадки:</span> ${item.planted_year}</div>` : ''}
          ${item.notes ? `<div class="popup-field"><span>Нотатка:</span> ${item.notes}</div>` : ''}
          <div><span class="popup-badge" style="background:${cfg.color}22; color:${cfg.color};">${cfg.label}</span></div>
        </div>
      `;

      marker.bindPopup(popupContent);
      marker.bindTooltip(`${item.crop || ''} (${item.distance_m}м)`, { direction: 'top', offset: [0, -10] });

      if (item.plot === 'house') {
        houseGroup.addLayer(marker);
      } else {
        mainGroup.addLayer(marker);
      }
    }

    // 6. Завантаження даних із папки Data/trees.csv
    async function loadTreeData() {
      const statusEl = document.getElementById('loadStatus');

      const pathsToTry = [
        './Data/trees.csv',
        'Data/trees.csv',
        './trees.csv'
      ];

      let csvText = null;

      for (const p of pathsToTry) {
        try {
          const res = await fetch(p + '?t=' + Date.now());
          if (res.ok) {
            csvText = await res.text();
            break;
          }
        } catch (e) {
          // пробуємо наступний шлях
        }
      }

      if (!csvText) {
        statusEl.innerHTML = `<span style="color:#d32f2f;">Не знайдено файл Data/trees.csv</span>`;
        return;
      }

      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        complete: function (res) {
          const validRows = res.data.filter(r => r.tree_id && r.crop);
          if (validRows.length === 0) {
            statusEl.innerText = 'Файл порожній або некоректний';
            return;
          }
          validRows.forEach(addTreeMarker);
          statusEl.innerHTML = `Відображено рослин: <b>${validRows.length}</b>`;
        }
      });
    }

    loadTreeData();

    // 7. Контрол вибору шарів
    L.control.layers({ "Google Супутник": googleSat, "OpenStreetMap": osm }, {
      "Основний сад (Main)": mainGroup,
      "Біля хати (House)": houseGroup
    }, { position: 'topleft', collapsed: false }).addTo(map);
  </script>
</body>

</html>

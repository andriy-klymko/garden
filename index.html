<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта саду | Потелич</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
      background: #222;
    }

    /* Панель калібрування зміщення */
    .calib-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(20, 25, 30, 0.9);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      font-size: 13px;
    }

    .calib-btn {
      background: #2e7d32;
      color: #fff;
      border: none;
      padding: 5px 10px;
      margin: 2px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .calib-btn:hover {
      background: #388e3c;
    }

    /* Легенда */
    .legend-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      font-size: 13px;
      max-width: 250px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #fff;
    }

    /* Маркери рослин */
    .tree-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .tree-icon:hover {
      transform: scale(1.4);
      z-index: 1000 !important;
    }

    .popup-box {
      font-size: 13px;
      min-width: 190px;
    }

    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #1b5e20;
      margin-bottom: 4px;
    }

    .popup-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- Панель точного регулювання зміщення ділянки -->
  <div class="calib-panel">
    <div style="font-weight: bold; margin-bottom: 6px;">🧭 Зсув ділянки (метрів):</div>
    <div style="display: flex; justify-content: center; margin-bottom: 4px;">
      <button class="calib-btn" onclick="shiftPolygon(0, 2)">▲ +2м Пн</button>
      <button class="calib-btn" onclick="shiftPolygon(0, 10)">▲ +10м</button>
    </div>
    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
      <button class="calib-btn" onclick="shiftPolygon(-2, 0)">◄ -2м Зх</button>
      <button class="calib-btn" onclick="shiftPolygon(2, 0)">+2м Сх ►</button>
      <button class="calib-btn" onclick="shiftPolygon(10, 0)">+10м ►</button>
    </div>
    <div style="display: flex; justify-content: center; margin-bottom: 6px;">
      <button class="calib-btn" onclick="shiftPolygon(0, -2)">▼ -2м Пд</button>
    </div>
    <div id="shiftStatus" style="font-size: 11px; color: #a5d6a7;">Зсув: Пн 0м, Сх 0м</div>

    <hr style="margin: 8px 0; border: 0.5px solid #444;" />
    <label style="font-size: 11px; display: block; margin-bottom: 4px;">Файл trees.csv не завантажився? Виберіть
      вручну:</label>
    <input type="file" id="csvFileInput" accept=".csv" style="font-size: 11px; color: #ccc;" />
  </div>

  <div class="legend-panel">
    <div style="font-weight: bold; margin-bottom: 6px; border-bottom: 1px solid #ddd; padding-bottom: 4px;">Стан
      насаджень</div>
    <div class="status-row"><span class="status-dot" style="background:#2e7d32;"></span> Прижилося</div>
    <div class="status-row"><span class="status-dot" style="background:#1976d2;"></span> Посаджено</div>
    <div class="status-row"><span class="status-dot" style="background:#f57c00;"></span> Сумнівно</div>
    <div class="status-row"><span class="status-dot" style="background:#d32f2f;"></span> Засохло</div>
    <div id="treeCount" style="margin-top: 6px; font-size: 11px; color: #666;">Завантаження списку...</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // 1. Ініціалізація
    const map = L.map('map', {
      center: [50.1761, 23.5526],
      zoom: 18,
      maxZoom: 22
    });

    // Підкладка Google Супутник (з гібридними написами без обмежень зуму)
    const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 22,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: 'Google Satellite'
    }).addTo(map);

    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });

    // 2. Межі ділянки
    const rawCoords = [
      [23.552623007, 50.175859531],
      [23.552169358, 50.176035001],
      [23.551742658, 50.175922815],
      [23.550862309, 50.176250741],
      [23.551428248, 50.176687972],
      [23.554073786, 50.175770358],
      [23.553974972, 50.175655295],
      [23.553579713, 50.175799124],
      [23.553121572, 50.175940075],
      [23.552991316, 50.175753099],
      [23.552623007, 50.175859531]
    ];

    const M_TO_LAT = 0.00000899;
    const M_TO_LON = 0.00001402;

    let offsetEastM = 0;
    let offsetNorthM = 0;
    let parcelPolygon = null;

    function renderPolygon() {
      if (parcelPolygon) map.removeLayer(parcelPolygon);

      const shifted = rawCoords.map(pt => {
        const lon = pt[0] + (offsetEastM * M_TO_LON);
        const lat = pt[1] + (offsetNorthM * M_TO_LAT);
        return [lat, lon];
      });

      parcelPolygon = L.polygon(shifted, {
        color: "#ffffff",
        weight: 2,
        dashArray: "4, 4",
        fillColor: "#4caf50",
        fillOpacity: 0.08
      }).addTo(map);
    }
    renderPolygon();

    // Функція зсуву з кнопок
    window.shiftPolygon = function (dEast, dNorth) {
      offsetEastM += dEast;
      offsetNorthM += dNorth;
      document.getElementById('shiftStatus').innerText =
        `Зсув: Пн ${offsetNorthM >= 0 ? '+' : ''}${offsetNorthM}м, Сх ${offsetEastM >= 0 ? '+' : ''}${offsetEastM}м`;
      renderPolygon();
      renderAllTrees(); // перемальовуємо дерева разом із контуром
    };

    // 3. Точки відліку насаджень
    const BASE_ORIGINS = {
      house: { lat: 50.175792, lon: 23.554144 },
      main: { lat: 50.176099, lon: 23.553156 }
    };

    const COS_BEARING = 0.978;
    const SIN_BEARING = 0.207;
    const ROW_SPACING_M = 3.5;

    function calculateTreeCoords(plot, row, dist) {
      const isHouse = (plot === 'house');
      const base = isHouse ? BASE_ORIGINS.house : BASE_ORIGINS.main;
      let rowOffsetMeters = 0;

      if (isHouse) {
        if (row === '1' || row === 'H-R1') rowOffsetMeters = 0.0;
        else if (row === '2' || row === 'H-R2') rowOffsetMeters = 3.5;
        else if (row === 'перед городом' || row === 'H-G') rowOffsetMeters = 7.0;
        else if (row === 'біля хати' || row === 'H-H') rowOffsetMeters = 11.5;
        else {
          const match = String(row).match(/\d+/);
          rowOffsetMeters = match ? (parseInt(match[0]) - 1) * ROW_SPACING_M : 0;
        }
      } else {
        let rNum = 1;
        if (typeof row === 'string') {
          const match = row.match(/\d+/);
          rNum = match ? parseInt(match[0]) : 1;
        } else {
          rNum = parseInt(row) || 1;
        }
        rowOffsetMeters = (rNum - 1) * ROW_SPACING_M;
      }

      // Зміщення з урахуванням загального калібрувального зсуву
      const dNorth = (rowOffsetMeters * COS_BEARING) + (dist * SIN_BEARING) + offsetNorthM;
      const dWest = (dist * COS_BEARING) - (rowOffsetMeters * SIN_BEARING) - offsetEastM;

      const lat = base.lat + (dNorth * M_TO_LAT);
      const lon = base.lon - (dWest * M_TO_LON);

      return [lat, lon];
    }

    // 4. Рендеринг насаджень
    const mainGroup = L.layerGroup().addTo(map);
    const houseGroup = L.layerGroup().addTo(map);
    let loadedTreesData = [];

    const statusConfig = {
      'прижилося': { color: '#2e7d32', label: 'Прижилося' },
      'посаджено': { color: '#1976d2', label: 'Посаджено' },
      'сумнівно': { color: '#f57c00', label: 'Сумнівно' },
      'засохло': { color: '#d32f2f', label: 'Засохло' }
    };

    function renderAllTrees() {
      mainGroup.clearLayers();
      houseGroup.clearLayers();

      loadedTreesData.forEach(item => {
        const dist = parseFloat(item.distance_m);
        if (isNaN(dist)) return;

        const coords = calculateTreeCoords(item.plot, item.row, dist);
        const cfg = statusConfig[item.status] || { color: '#757575', label: item.status || 'Невідомо' };

        const isBush = ['Малина', 'Смородина', 'Аґрус', 'Жимолость'].some(c => (item.crop || '').includes(c));
        const iconSymbol = isBush ? '🫐' : '🌳';
        const markerSize = isBush ? 18 : 22;

        const treeIcon = L.divIcon({
          className: 'custom-tree-div',
          html: `<div class="tree-icon" style="background:${cfg.color}; width:${markerSize}px; height:${markerSize}px;">${iconSymbol}</div>`,
          iconSize: [markerSize, markerSize],
          iconAnchor: [markerSize / 2, markerSize / 2]
        });

        const marker = L.marker(coords, { icon: treeIcon });
        marker.bindPopup(`
          <div class="popup-box">
            <div class="popup-title">${item.crop || ''} ${item.variety ? `"${item.variety}"` : ''}</div>
            <div><b>ID:</b> ${item.tree_id || ''}</div>
            <div><b>Ряд:</b> ${item.row}, <b>Позиція:</b> ${item.distance_m}м</div>
            ${item.rootstock ? `<div><b>Підщепа:</b> ${item.rootstock}</div>` : ''}
            <div><span class="popup-badge" style="background:${cfg.color}22; color:${cfg.color};">${cfg.label}</span></div>
          </div>
        `);

        if (item.plot === 'house') houseGroup.addLayer(marker);
        else mainGroup.addLayer(marker);
      });
    }

    function processParsedData(data) {
      loadedTreesData = data.filter(r => r.tree_id && r.crop);
      document.getElementById('treeCount').innerText = `Відображено рослин: ${loadedTreesData.length}`;
      renderAllTrees();
    }

    // Автоматичне завантаження trees.csv
    Papa.parse('trees.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function (res) {
        if (res.data && res.data.length > 0) {
          processParsedData(res.data);
        }
      },
      error: function () {
        document.getElementById('treeCount').innerText = 'Не вдалося автозавантажити CSV. Виберіть файл внизу.';
      }
    });

    // Ручний вибір файлу (працює завжди, навіть локально на комп'ютері)
    document.getElementById('csvFileInput').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function (res) {
          processParsedData(res.data);
        }
      });
    });

    // Меню шарів
    L.control.layers({ "Google Супутник": googleSat, "OpenStreetMap": osm }, {
      "Основний сад": mainGroup,
      "Біля хати": houseGroup
    }, { position: 'topleft', collapsed: false }).addTo(map);
  </script>
</body>

</html>

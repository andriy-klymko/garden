<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта саду | Потелич</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
      background: #222;
    }

    /* Панель керування */
    .control-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(20, 25, 30, 0.92);
      color: #fff;
      padding: 14px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      max-width: 320px;
    }

    .panel-btn {
      background: #2e7d32;
      color: #fff;
      border: none;
      padding: 6px 10px;
      margin: 3px 2px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }

    .panel-btn:hover {
      background: #388e3c;
    }

    .panel-btn.alt {
      background: #1976d2;
    }

    .panel-btn.alt:hover {
      background: #1e88e5;
    }

    /* Легенда */
    .legend-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      font-size: 13px;
      min-width: 220px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #fff;
    }

    /* Маркери дерев */
    .tree-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .tree-icon:hover {
      transform: scale(1.4);
      z-index: 1000 !important;
    }

    /* Прапорці стартових точок */
    .origin-pin {
      background: #ffeb3b;
      border: 2px solid #d32f2f;
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: bold;
      font-size: 11px;
      color: #000;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      cursor: grab;
    }

    .origin-pin:active {
      cursor: grabbing;
    }

    .popup-box {
      font-size: 13px;
      min-width: 190px;
    }

    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #1b5e20;
      margin-bottom: 4px;
    }

    .popup-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- Панель налаштування -->
  <div class="control-panel">
    <div style="font-weight: bold; margin-bottom: 6px;">🎯 Налаштування рядів</div>
    <div style="color: #bbb; font-size: 11px; margin-bottom: 8px;">
      Перетягуйте жовті прапорці <b>«🚩 Старт»</b> мишкою на карті для точної посадки.
    </div>

    <div style="margin-bottom: 6px;">
      <button class="panel-btn alt" onclick="toggleMainRowDirection()">Інверсія рядів Main ↕</button>
      <button class="panel-btn alt" onclick="toggleHouseRowDirection()">Інверсія рядів House ↕</button>
    </div>

    <hr style="margin: 8px 0; border: 0.5px solid #444;" />
    <label style="font-size: 11px; display: block; margin-bottom: 4px;">Завантажити інший CSV:</label>
    <input type="file" id="csvFileInput" accept=".csv" style="font-size: 11px; color: #ccc;" />
    <div id="coordsDebug" style="font-size: 10px; color: #aaa; margin-top: 6px;"></div>
  </div>

  <div class="legend-panel">
    <div style="font-weight: bold; margin-bottom: 6px; border-bottom: 1px solid #ddd; padding-bottom: 4px;">Стан
      насаджень</div>
    <div class="status-row"><span class="status-dot" style="background:#2e7d32;"></span> Прижилося</div>
    <div class="status-row"><span class="status-dot" style="background:#1976d2;"></span> Посаджено</div>
    <div class="status-row"><span class="status-dot" style="background:#f57c00;"></span> Сумнівно</div>
    <div class="status-row"><span class="status-dot" style="background:#d32f2f;"></span> Засохло</div>
    <div id="treeCount" style="margin-top: 6px; font-size: 11px; color: #666;">Завантаження...</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const map = L.map('map', {
      center: [50.1761, 23.5526],
      zoom: 18,
      maxZoom: 22
    });

    const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 22,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: 'Google Satellite'
    }).addTo(map);

    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });

    // Контур ділянки
    const rawCoords = [
      [23.552623007, 50.175859531],
      [23.552169358, 50.176035001],
      [23.551742658, 50.175922815],
      [23.550862309, 50.176250741],
      [23.551428248, 50.176687972],
      [23.554073786, 50.175770358],
      [23.553974972, 50.175655295],
      [23.553579713, 50.175799124],
      [23.553121572, 50.175940075],
      [23.552991316, 50.175753099],
      [23.552623007, 50.175859531]
    ];

    const parcelPolygon = L.polygon(rawCoords.map(p => [p[1], p[0]]), {
      color: "#ffffff",
      weight: 2,
      dashArray: "4, 4",
      fillColor: "#4caf50",
      fillOpacity: 0.05
    }).addTo(map);

    // Базові точки (поміняні місцями відповідно до аналізу ділянки)
    let originMain = { lat: 50.175792, lon: 23.554144 };   // Східний кут поля
    let originHouse = { lat: 50.175940, lon: 23.553121 };  // Кут біля хати

    let mainDirInvert = 1;   // 1 або -1 для зміни напрямку росту рядів
    let houseDirInvert = 1;

    const M_TO_LAT = 0.00000899;
    const M_TO_LON = 0.00001402;
    const COS_BEARING = 0.978;
    const SIN_BEARING = 0.207;
    const ROW_SPACING_M = 3.5;

    // Перетяжні маркери точок відліку
    const mainMarker = L.marker([originMain.lat, originMain.lon], {
      draggable: true,
      icon: L.divIcon({ className: '', html: '<div class="origin-pin">🚩 Старт Main</div>', iconSize: [80, 20] })
    }).addTo(map);

    const houseMarker = L.marker([originHouse.lat, originHouse.lon], {
      draggable: true,
      icon: L.divIcon({ className: '', html: '<div class="origin-pin">🏠 Старт Хата</div>', iconSize: [80, 20] })
    }).addTo(map);

    function updateDebugInfo() {
      document.getElementById('coordsDebug').innerHTML =
        `Main: ${originMain.lat.toFixed(6)}, ${originMain.lon.toFixed(6)}<br>` +
        `Хата: ${originHouse.lat.toFixed(6)}, ${originHouse.lon.toFixed(6)}`;
    }
    updateDebugInfo();

    mainMarker.on('drag', function (e) {
      const pos = e.target.getLatLng();
      originMain.lat = pos.lat;
      originMain.lon = pos.lon;
      updateDebugInfo();
      renderAllTrees();
    });

    houseMarker.on('drag', function (e) {
      const pos = e.target.getLatLng();
      originHouse.lat = pos.lat;
      originHouse.lon = pos.lon;
      updateDebugInfo();
      renderAllTrees();
    });

    window.toggleMainRowDirection = function () {
      mainDirInvert *= -1;
      renderAllTrees();
    };

    window.toggleHouseRowDirection = function () {
      houseDirInvert *= -1;
      renderAllTrees();
    };

    function calculateTreeCoords(plot, row, dist) {
      const isHouse = (plot === 'house');
      const base = isHouse ? originHouse : originMain;
      const invert = isHouse ? houseDirInvert : mainDirInvert;
      let rowOffsetMeters = 0;

      if (isHouse) {
        if (row === '1' || row === 'H-R1') rowOffsetMeters = 0.0;
        else if (row === '2' || row === 'H-R2') rowOffsetMeters = 3.5;
        else if (row === 'перед городом' || row === 'H-G') rowOffsetMeters = 7.0;
        else if (row === 'біля хати' || row === 'H-H') rowOffsetMeters = 11.5;
        else {
          const match = String(row).match(/\d+/);
          rowOffsetMeters = match ? (parseInt(match[0]) - 1) * ROW_SPACING_M : 0;
        }
      } else {
        let rNum = 1;
        if (typeof row === 'string') {
          const match = row.match(/\d+/);
          rNum = match ? parseInt(match[0]) : 1;
        } else {
          rNum = parseInt(row) || 1;
        }
        rowOffsetMeters = (rNum - 1) * ROW_SPACING_M;
      }

      // Напрямок рядів з урахуванням інверсії
      const dNorth = (rowOffsetMeters * invert * COS_BEARING) + (dist * SIN_BEARING);
      const dWest = (dist * COS_BEARING) - (rowOffsetMeters * invert * SIN_BEARING);

      const lat = base.lat + (dNorth * M_TO_LAT);
      const lon = base.lon - (dWest * M_TO_LON);

      return [lat, lon];
    }

    const mainGroup = L.layerGroup().addTo(map);
    const houseGroup = L.layerGroup().addTo(map);
    let loadedTreesData = [];

    const statusConfig = {
      'прижилося': { color: '#2e7d32', label: 'Прижилося' },
      'посаджено': { color: '#1976d2', label: 'Посаджено' },
      'сумнівно': { color: '#f57c00', label: 'Сумнівно' },
      'засохло': { color: '#d32f2f', label: 'Засохло' }
    };

    function renderAllTrees() {
      mainGroup.clearLayers();
      houseGroup.clearLayers();

      loadedTreesData.forEach(item => {
        const dist = parseFloat(item.distance_m);
        if (isNaN(dist)) return;

        const coords = calculateTreeCoords(item.plot, item.row, dist);
        const cfg = statusConfig[item.status] || { color: '#757575', label: item.status || 'Невідомо' };

        const isBush = ['Малина', 'Смородина', 'Аґрус', 'Жимолость'].some(c => (item.crop || '').includes(c));
        const iconSymbol = isBush ? '🫐' : '🌳';
        const markerSize = isBush ? 18 : 22;

        const treeIcon = L.divIcon({
          className: 'custom-tree-div',
          html: `<div class="tree-icon" style="background:${cfg.color}; width:${markerSize}px; height:${markerSize}px;">${iconSymbol}</div>`,
          iconSize: [markerSize, markerSize],
          iconAnchor: [markerSize / 2, markerSize / 2]
        });

        const marker = L.marker(coords, { icon: treeIcon });
        marker.bindPopup(`
          <div class="popup-box">
            <div class="popup-title">${item.crop || ''} ${item.variety ? `"${item.variety}"` : ''}</div>
            <div><b>ID:</b> ${item.tree_id || ''}</div>
            <div><b>Ряд:</b> ${item.row}, <b>Позиція:</b> ${item.distance_m}м</div>
            ${item.rootstock ? `<div><b>Підщепа:</b> ${item.rootstock}</div>` : ''}
            <div><span class="popup-badge" style="background:${cfg.color}22; color:${cfg.color};">${cfg.label}</span></div>
          </div>
        `);

        if (item.plot === 'house') houseGroup.addLayer(marker);
        else mainGroup.addLayer(marker);
      });
    }

    function processParsedData(data) {
      loadedTreesData = data.filter(r => r.tree_id && r.crop);
      document.getElementById('treeCount').innerText = `Відображено рослин: ${loadedTreesData.length}`;
      renderAllTrees();
    }

    // Спроба автоматичного завантаження CSV з репозиторію
    Papa.parse('trees.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function (res) {
        if (res.data && res.data.length > 0) processParsedData(res.data);
      }
    });

    // Ручний вибір файлу
    document.getElementById('csvFileInput').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function (res) { processParsedData(res.data); }
      });
    });

    L.control.layers({ "Google Супутник": googleSat, "OpenStreetMap": osm }, {
      "Основний сад": mainGroup,
      "Біля хати": houseGroup
    }, { position: 'topleft', collapsed: false }).addTo(map);
  </script>
</body>

</html>
